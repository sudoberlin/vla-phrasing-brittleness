[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-phrasing"
version = "0.1.0"
description = "Controlled evaluation of instruction-phrasing sensitivity in vision-language-action policies"
authors = [{ name = "Shubham Singh" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
